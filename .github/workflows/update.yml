name: Update news

on:
  schedule:
    - cron: "0 0,12 * * *"   # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:          # lets you click "Run workflow" manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated site
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
